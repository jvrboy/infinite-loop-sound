name: Build Unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-ios-unsigned:
    name: Build unsigned iOS IPA
    runs-on: macos-14

    env:
      IOS_DEPLOYMENT_TARGET: "12.0"
      CONFIGURATION: "Release"

      # Optional:
      # If automatic scheme detection fails, put your scheme name here.
      # Example: SCHEME: "MyApp"
      SCHEME: ""

      # Name of the final IPA file.
      IPA_NAME: "unsigned-ios-app.ipa"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show repository files
        run: |
          echo "Current directory:"
          pwd
          echo ""
          echo "Top level files:"
          ls -la
          echo ""
          echo "Project tree:"
          find . -maxdepth 3 -type f | sed 's#^\./##' | sort | head -300

      - name: Show Xcode version
        run: |
          xcodebuild -version
          xcode-select -p

      - name: Detect app type
        id: detect
        run: |
          set -e

          FRAMEWORK="unknown"

          if find . -name "*.xcworkspace" -o -name "*.xcodeproj" | grep -q .; then
            FRAMEWORK="xcode"
          elif [ -f "pubspec.yaml" ]; then
            FRAMEWORK="flutter"
          elif [ -f "package.json" ] && grep -qi '"expo"' package.json; then
            FRAMEWORK="expo"
          elif [ -f "package.json" ] && find . -maxdepth 2 \( -name "capacitor.config.ts" -o -name "capacitor.config.js" -o -name "capacitor.config.json" \) | grep -q .; then
            FRAMEWORK="capacitor"
          elif [ -f "package.json" ]; then
            FRAMEWORK="node"
          fi

          echo "framework=$FRAMEWORK" >> "$GITHUB_OUTPUT"
          echo "Detected framework: $FRAMEWORK"

      - name: Setup Node.js
        if: steps.detect.outputs.framework == 'expo' || steps.detect.outputs.framework == 'capacitor' || steps.detect.outputs.framework == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Node dependencies
        if: steps.detect.outputs.framework == 'expo' || steps.detect.outputs.framework == 'capacitor' || steps.detect.outputs.framework == 'node'
        run: |
          set -e

          if [ -f "package-lock.json" ]; then
            npm ci
          else
            npm install
          fi

      - name: Setup Flutter
        if: steps.detect.outputs.framework == 'flutter'
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Prepare Flutter iOS project
        if: steps.detect.outputs.framework == 'flutter'
        run: |
          set -e

          flutter --version
          flutter pub get

          if [ ! -d "ios" ]; then
            echo "No ios folder found. Creating Flutter iOS project..."
            flutter create --platforms=ios .
          else
            echo "ios folder already exists."
          fi

          flutter pub get

      - name: Prepare Expo iOS project
        if: steps.detect.outputs.framework == 'expo'
        run: |
          set -e

          if [ ! -d "ios" ]; then
            echo "No ios folder found. Running Expo prebuild..."
            npx expo prebuild --platform ios --non-interactive
          else
            echo "ios folder already exists."
          fi

      - name: Prepare Capacitor iOS project
        if: steps.detect.outputs.framework == 'capacitor'
        run: |
          set -e

          if npm run | grep -q " build"; then
            npm run build
          else
            echo "No npm build script found, skipping web build."
          fi

          if [ ! -d "ios" ]; then
            echo "No ios folder found. Adding Capacitor iOS platform..."
            npx cap add ios
          else
            echo "ios folder already exists."
          fi

          npx cap sync ios

      - name: Stop if no iOS project can be created
        if: steps.detect.outputs.framework == 'node' || steps.detect.outputs.framework == 'unknown'
        run: |
          echo "No iOS project was found or generated."
          echo ""
          echo "This repo does not contain:"
          echo "- .xcodeproj"
          echo "- .xcworkspace"
          echo "- Flutter pubspec.yaml"
          echo "- Expo package.json"
          echo "- Capacitor config"
          echo ""
          echo "An unsigned IPA requires an iOS project."
          echo "If this is a plain web app, convert it to Capacitor first, then run this workflow again."
          exit 1

      - name: Install CocoaPods dependencies
        run: |
          set -e

          PODFILES=$(find . -name "Podfile" -not -path "*/Pods/*")

          if [ -z "$PODFILES" ]; then
            echo "No Podfile found, skipping CocoaPods."
            exit 0
          fi

          echo "$PODFILES" | while read -r PODFILE; do
            POD_DIR=$(dirname "$PODFILE")
            echo "Installing pods in $POD_DIR"
            cd "$GITHUB_WORKSPACE/$POD_DIR"
            pod install --repo-update
          done

      - name: Force iOS 12 deployment target
        run: |
          set -e

          echo "Forcing iOS deployment target to $IOS_DEPLOYMENT_TARGET"

          find . -name "project.pbxproj" -print0 | while IFS= read -r -d '' file; do
            echo "Updating $file"
            sed -i '' "s/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*;/IPHONEOS_DEPLOYMENT_TARGET = $IOS_DEPLOYMENT_TARGET;/g" "$file"
          done

      - name: Find Xcode workspace/project and scheme
        id: xcode
        run: |
          set -e

          echo "Searching for Xcode workspaces/projects..."

          WORKSPACE=$(find . -name "*.xcworkspace" -not -path "*/Pods/*" | sort | head -n 1 || true)
          PROJECT=$(find . -name "*.xcodeproj" -not -path "*/Pods/*" | sort | head -n 1 || true)

          if [ -n "$WORKSPACE" ]; then
            TYPE="workspace"
            XCODE_PATH="$WORKSPACE"
            BUILD_FLAG="-workspace"
          elif [ -n "$PROJECT" ]; then
            TYPE="project"
            XCODE_PATH="$PROJECT"
            BUILD_FLAG="-project"
          else
            echo "No .xcworkspace or .xcodeproj found after generation."
            echo ""
            echo "Files found:"
            find . -maxdepth 5 -type f | sort | head -300
            exit 1
          fi

          echo "Found $TYPE: $XCODE_PATH"

          echo "type=$TYPE" >> "$GITHUB_OUTPUT"
          echo "path=$XCODE_PATH" >> "$GITHUB_OUTPUT"
          echo "build_flag=$BUILD_FLAG" >> "$GITHUB_OUTPUT"

          echo ""
          echo "Available schemes:"
          xcodebuild -list "$BUILD_FLAG" "$XCODE_PATH" || true

          if [ -n "$SCHEME" ]; then
            FINAL_SCHEME="$SCHEME"
            echo "Using manually provided scheme: $FINAL_SCHEME"
          else
            FINAL_SCHEME=$(xcodebuild -list "$BUILD_FLAG" "$XCODE_PATH" 2>/dev/null | awk '
              /Schemes:/ { found=1; next }
              found && NF { print $0; exit }
            ' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')

            if [ -z "$FINAL_SCHEME" ]; then
              echo "Could not auto-detect scheme."
              echo "Set SCHEME in the workflow env section."
              exit 1
            fi

            echo "Auto-detected scheme: $FINAL_SCHEME"
          fi

          echo "scheme=$FINAL_SCHEME" >> "$GITHUB_OUTPUT"

      - name: Build Flutter iOS app without code signing
        if: steps.detect.outputs.framework == 'flutter'
        run: |
          set -e

          flutter build ios \
            --release \
            --no-codesign \
            --build-number="${{ github.run_number }}"

      - name: Build Xcode iOS app without code signing
        if: steps.detect.outputs.framework != 'flutter'
        run: |
          set -e

          xcodebuild clean build \
            "${{ steps.xcode.outputs.build_flag }}" "${{ steps.xcode.outputs.path }}" \
            -scheme "${{ steps.xcode.outputs.scheme }}" \
            -configuration "$CONFIGURATION" \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            IPHONEOS_DEPLOYMENT_TARGET="$IOS_DEPLOYMENT_TARGET" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      - name: Find built .app
        id: app
        run: |
          set -e

          echo "Searching for built .app..."

          APP_PATH=""

          if [ "${{ steps.detect.outputs.framework }}" = "flutter" ]; then
            APP_PATH=$(find build/ios/iphoneos -name "*.app" -type d | head -n 1 || true)
          fi

          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find build/DerivedData/Build/Products -path "*iphoneos/*.app" -type d | head -n 1 || true)
          fi

          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find . -path "*/Build/Products/*iphoneos/*.app" -type d | head -n 1 || true)
          fi

          if [ -z "$APP_PATH" ]; then
            echo "No .app file found."
            echo ""
            echo "Build products:"
            find build -maxdepth 8 -type d 2>/dev/null | sort | head -300 || true
            exit 1
          fi

          echo "Found app: $APP_PATH"
          echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"

      - name: Create unsigned IPA
        run: |
          set -e

          APP_PATH="${{ steps.app.outputs.app_path }}"

          rm -rf ipa_output
          mkdir -p ipa_output/Payload

          cp -R "$APP_PATH" ipa_output/Payload/

          cd ipa_output
          zip -qry "../$IPA_NAME" Payload
          cd ..

          echo "Created IPA:"
          ls -lh "$IPA_NAME"

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-ios-ipa
          path: ${{ env.IPA_NAME }}
          if-no-files-found: error