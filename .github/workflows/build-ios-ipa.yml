name: Build Unsigned iOS IPA

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-ios:
    name: Build unsigned Capacitor IPA (iOS 15+)
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Prepare static web bundle for Capacitor
        run: |
          rm -rf dist
          mkdir -p dist
          if [ -d ".vercel/output/static" ]; then
            cp -R .vercel/output/static/. dist/
          elif [ -d ".output/public" ]; then
            cp -R .output/public/. dist/
          else
            echo "::error title=Missing static output::No .vercel/output/static or .output/public directory was produced."
            exit 1
          fi

          if [ ! -f dist/index.html ]; then
            node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const assetsDir = path.join('dist', 'assets');
          const assets = fs.existsSync(assetsDir) ? fs.readdirSync(assetsDir) : [];
          const js = assets.find((name) => name.endsWith('.js'));
          const css = assets.find((name) => name.endsWith('.css'));
          fs.writeFileSync(
            path.join('dist', 'index.html'),
            `<!doctype html><html lang="en" class="dark"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>Divergence IQ</title>${css ? `<link rel="stylesheet" href="/assets/${css}">` : ''}</head><body class="dark"><div id="app"></div>${js ? `<script type="module" src="/assets/${js}"></script>` : ''}</body></html>`
          );
          NODE
          fi

          test -s dist/index.html
          du -sh dist

      - name: Create and sync Capacitor iOS project
        run: |
          if [ ! -d ios/App ]; then
            npx cap add ios
          fi
          npx cap sync ios

      - name: Generate iOS app icons
        run: |
          node <<'NODE'
          const sharp = require('sharp');
          const fs = require('fs');
          const path = require('path');
          const svgPath = 'public/app-icons/default.svg';
          if (!fs.existsSync(svgPath)) throw new Error(`Missing ${svgPath}`);
          const iconSetDir = 'ios/App/App/Assets.xcassets/AppIcon.appiconset';
          fs.mkdirSync(iconSetDir, { recursive: true });
          const svgBuffer = fs.readFileSync(svgPath);
          const icons = [20, 29, 40, 60, 76, 80, 87, 120, 152, 167, 180, 1024];
          const contents = { images: [], info: { version: 1, author: 'xcode' } };
          (async () => {
            for (const size of icons) {
              const filename = `icon-${size}.png`;
              await sharp(svgBuffer).resize(size, size).png().toFile(path.join(iconSetDir, filename));
              contents.images.push({ idiom: 'universal', size: `${size}x${size}`, filename, platform: 'ios' });
            }
            fs.writeFileSync(path.join(iconSetDir, 'Contents.json'), JSON.stringify(contents, null, 2));
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Enforce iOS 15 deployment target
        run: |
          PODFILE="ios/App/Podfile"
          PBXPROJ="ios/App/App.xcodeproj/project.pbxproj"
          if [ -f "$PODFILE" ]; then
            if grep -q "platform :ios" "$PODFILE"; then
              sed -i '' "s/platform :ios, '[0-9.]*'/platform :ios, '15.0'/" "$PODFILE"
            else
              sed -i '' "1s/^/platform :ios, '15.0'\n/" "$PODFILE"
            fi
          fi
          if [ -f "$PBXPROJ" ]; then
            sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*/IPHONEOS_DEPLOYMENT_TARGET = 15.0/g' "$PBXPROJ"
          fi
          grep -R "IPHONEOS_DEPLOYMENT_TARGET = 15.0" ios/App/App.xcodeproj/project.pbxproj >/dev/null

      - name: Install CocoaPods
        working-directory: ios/App
        run: pod install --repo-update

      - name: Build unsigned IPA
        working-directory: ios/App
        run: |
          set -euo pipefail
          xcodebuild clean archive \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination generic/platform=iOS \
            -archivePath "$PWD/build/App.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE="" \
            PROVISIONING_PROFILE_SPECIFIER=""

          rm -rf build/Payload build/App.ipa
          mkdir -p build/Payload
          cp -R build/App.xcarchive/Products/Applications/App.app build/Payload/
          (cd build && zip -qry App.ipa Payload)

      - name: Verify IPA contents
        run: |
          set -euo pipefail
          IPA_PATH="ios/App/build/App.ipa"
          test -s "$IPA_PATH"
          unzip -t "$IPA_PATH" >/dev/null
          unzip -l "$IPA_PATH" | grep -E 'Payload/App\.app/(Info\.plist|public/index\.html)'
          IPA_SIZE=$(stat -f%z "$IPA_PATH")
          if [ "$IPA_SIZE" -lt 5000000 ]; then
            echo "::warning title=Small IPA::IPA is $IPA_SIZE bytes; inspect the artifact if this is unexpected."
          fi
          echo "IPA_PATH=$IPA_PATH" >> "$GITHUB_ENV"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: DivergenceIQ-Unsigned-iOS15-IPA
          path: ${{ env.IPA_PATH }}
          if-no-files-found: error

      - name: Upload IPA as GitHub Release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="ios-unsigned-$(date +%Y%m%d-%H%M%S)"
          gh release create "$TAG" \
            --title "Unsigned iOS IPA - $(date +%Y-%m-%d)" \
            --notes "Auto-built unsigned Capacitor IPA for iOS 15+. This build intentionally disables code signing." \
            "$IPA_PATH#DivergenceIQ-Unsigned-iOS15.ipa"
