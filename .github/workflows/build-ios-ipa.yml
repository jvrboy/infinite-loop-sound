name: Build Unsigned iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Capacitor
        run: npm install @capacitor/core @capacitor/cli @capacitor/ios

      - name: Generate TanStack Router route tree
        run: npx tsr generate
        continue-on-error: true

      - name: Build web app (vercel preset)
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Prepare dist/ for Capacitor
        run: |
          mkdir -p dist
          if [ -d ".vercel/output/static" ]; then
            echo "Copying .vercel/output/static to dist/"
            cp -r .vercel/output/static/. dist/
          fi
          echo "dist/ contents:"
          ls dist/
          python3 - << 'PYEOF'
          import os, glob
          dist = 'dist'
          if os.path.exists(os.path.join(dist, 'index.html')):
              print("index.html already exists")
          else:
              print("Generating index.html...")
              js_files = sorted(glob.glob(f'{dist}/assets/*.js'))
              css_files = sorted(glob.glob(f'{dist}/assets/*.css'))
              main_js = next((f for f in js_files if any(x in f for x in ['index', 'main', 'app'])), js_files[-1] if js_files else '')
              main_css = css_files[0] if css_files else ''
              js_name = os.path.basename(main_js) if main_js else ''
              css_name = os.path.basename(main_css) if main_css else ''
              css_tag = f'<link rel="stylesheet" href="/assets/{css_name}" />' if css_name else ''
              js_tag = f'<script type="module" src="/assets/{js_name}"></script>' if js_name else ''
              html = f'''<!DOCTYPE html>
          <html lang="en" class="dark">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
              <meta name="apple-mobile-web-app-capable" content="yes" />
              <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
              <title>Divergence IQ</title>
              {css_tag}
            </head>
            <body class="dark">
              <div id="app"></div>
              {js_tag}
            </body>
          </html>'''
              with open(os.path.join(dist, 'index.html'), 'w') as f:
                  f.write(html)
              print(f"Generated index.html (js={js_name}, css={css_name})")
          PYEOF
          echo "index.html exists: $([ -f dist/index.html ] && echo YES || echo NO)"

      - name: Add iOS platform
        run: npx cap add ios

      - name: Sync iOS platform
        run: npx cap sync ios

      - name: Build unsigned IPA
        run: |
          cd ios/App
          xcodebuild clean archive \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -archivePath $PWD/build/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE="" \
            PROVISIONING_PROFILE_SPECIFIER=""
          mkdir -p build/Payload
          cp -r build/App.xcarchive/Products/Applications/App.app build/Payload/
          cd build
          zip -r App.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DivergenceIQ-iOS-Unsigned
          path: ios/App/build/App.ipa
          retention-days: 5
