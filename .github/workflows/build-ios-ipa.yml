name: Build Unsigned iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Capacitor
        run: npm install @capacitor/core @capacitor/cli @capacitor/ios

      - name: Generate TanStack Router route tree
        run: npx tsr generate
        continue-on-error: true

      - name: Build web app (vercel preset)
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Prepare dist/ for Capacitor
        run: |
          # The nitro:vercel preset outputs static assets to .vercel/output/static/
          # Capacitor expects them in dist/ with an index.html entry point
          mkdir -p dist

          if [ -d ".vercel/output/static" ]; then
            echo "Copying .vercel/output/static contents to dist/"
            cp -r .vercel/output/static/. dist/
          fi

          # List what we have
          echo "=== dist/ contents ==="
          ls -la dist/

          # If no index.html exists, generate one that bootstraps the SPA
          if [ ! -f "dist/index.html" ]; then
            echo "No index.html found, generating SPA bootstrap..."
            # Find the main JS entry file
            MAIN_JS=$(ls dist/assets/*.js 2>/dev/null | grep -E "index|main|app" | head -1 || ls dist/assets/*.js 2>/dev/null | tail -1)
            MAIN_CSS=$(ls dist/assets/*.css 2>/dev/null | head -1 || echo "")
            echo "Main JS: $MAIN_JS"
            echo "Main CSS: $MAIN_CSS"
            
            JS_FILE=$(basename "$MAIN_JS" 2>/dev/null || echo "")
            CSS_FILE=$(basename "$MAIN_CSS" 2>/dev/null || echo "")
            
            cat > dist/index.html << HTMLEOF
<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Divergence IQ</title>
    $([ -n "$CSS_FILE" ] && echo "<link rel=\"stylesheet\" href=\"/assets/$CSS_FILE\" />" || echo "")
  </head>
  <body class="dark">
    <div id="app"></div>
    $([ -n "$JS_FILE" ] && echo "<script type=\"module\" src=\"/assets/$JS_FILE\"></script>" || echo "")
  </body>
</html>
HTMLEOF
            echo "Generated index.html"
          fi

          echo "=== Final dist/ contents ==="
          ls dist/
          echo "index.html exists: $([ -f dist/index.html ] && echo YES || echo NO)"

      - name: Add iOS platform
        run: npx cap add ios

      - name: Sync iOS platform
        run: npx cap sync ios

      - name: Build unsigned IPA
        run: |
          cd ios/App
          # Build the archive without code signing
          xcodebuild clean archive \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -archivePath $PWD/build/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE="" \
            PROVISIONING_PROFILE_SPECIFIER=""

          # Package the .app into an IPA
          mkdir -p build/Payload
          cp -r build/App.xcarchive/Products/Applications/App.app build/Payload/
          cd build
          zip -r App.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DivergenceIQ-iOS-Unsigned
          path: ios/App/build/App.ipa
          retention-days: 5
